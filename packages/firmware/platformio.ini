[env]
build_flags = -std=gnu++17 -I include

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<device/> -<config_store.cpp>

[env:aura1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
; The board ships as 4MB/2MB or 8MB/8MB. The devkitc-1 default header says 8MB,
; and IDF aborts at boot when the header exceeds the real chip. 4MB runs on both.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Mozilla root store for TLS verification (WiFiClientSecure::setCACertBundle).
; Regenerate: ESP-IDF v4.4 components/mbedtls/esp_crt_bundle/gen_crt_bundle.py
;   -i cacert.pem (https://curl.se/ca/cacert.pem), output renamed to this path.
board_build.embed_files = data/cert/x509_crt_bundle.bin
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@^1.6.2
  bblanchon/ArduinoJson@^7.2.0
; Not ${env.build_flags}: build_flags also reach the framework, where -I include
; makes FreeRTOS's "queue.h" resolve to ours. build_src_flags reach only src/.
; -I . finds the gitignored secrets.h in the project root.
build_flags = -DBOARD_HAS_PSRAM
build_src_flags = -std=gnu++17 -I .
