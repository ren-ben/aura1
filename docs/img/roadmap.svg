<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Roadmap: six phases from the vertical slice to audio">
  <defs>
    <style>
      .h { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #C5BCAB; letter-spacing: 3px; }
      .p { font: 11px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #6E6A62; letter-spacing: 1px; }
      .pNow { font: 11px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #DBD5CA; letter-spacing: 1px; }
      .t { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #DBD5CA; }
      .s { font: 11px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #9A9385; }
      .rail { stroke: #6E6A62; stroke-width: 1.2; }
      .done { stroke: #C5BCAB; stroke-width: 1.2; }
      .node { fill: #121212; stroke: #C5BCAB; stroke-width: 1.2; }
      .nodeNow { fill: #C5BCAB; stroke: #C5BCAB; stroke-width: 1.2; }
    </style>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#1F1F1F"/>
    </pattern>
  </defs>

  <rect width="960" height="250" fill="#121212"/>
  <rect width="960" height="250" fill="url(#dither)"/>

  <text x="20" y="34" class="h">ROADMAP</text>

  <line x1="60" y1="110" x2="900" y2="110" class="rail"/>

  <!-- 1 -->
  <text x="60" y="88" text-anchor="middle" class="pNow">PHASE 1</text>
  <circle cx="60" cy="110" r="9" class="nodeNow"/>
  <text x="60" y="142" text-anchor="middle" class="t">Vertical slice</text>
  <text x="60" y="162" text-anchor="middle" class="s">you are here:</text>
  <text x="60" y="178" text-anchor="middle" class="s">hardware test</text>

  <!-- 2 -->
  <text x="228" y="88" text-anchor="middle" class="p">PHASE 2</text>
  <circle cx="228" cy="110" r="9" class="node"/>
  <text x="228" y="142" text-anchor="middle" class="t">Full features</text>
  <text x="228" y="162" text-anchor="middle" class="s">habits, quotes,</text>
  <text x="228" y="178" text-anchor="middle" class="s">XP, decay</text>

  <!-- 3 -->
  <text x="396" y="88" text-anchor="middle" class="p">PHASE 3</text>
  <circle cx="396" cy="110" r="9" class="node"/>
  <text x="396" y="142" text-anchor="middle" class="t">Kael'thos art</text>
  <text x="396" y="162" text-anchor="middle" class="s">SVG rig,</text>
  <text x="396" y="178" text-anchor="middle" class="s">skins, poses</text>

  <!-- 4 -->
  <text x="564" y="88" text-anchor="middle" class="p">PHASE 4</text>
  <circle cx="564" cy="110" r="9" class="node"/>
  <text x="564" y="142" text-anchor="middle" class="t">Device UI</text>
  <text x="564" y="162" text-anchor="middle" class="s">real screens,</text>
  <text x="564" y="178" text-anchor="middle" class="s">screensavers</text>

  <!-- 5 -->
  <text x="732" y="88" text-anchor="middle" class="p">PHASE 5</text>
  <circle cx="732" cy="110" r="9" class="node"/>
  <text x="732" y="142" text-anchor="middle" class="t">Dashboard</text>
  <text x="732" y="162" text-anchor="middle" class="s">node graph,</text>
  <text x="732" y="178" text-anchor="middle" class="s">type, motion</text>

  <!-- 6 -->
  <text x="900" y="88" text-anchor="middle" class="p">PHASE 6</text>
  <circle cx="900" cy="110" r="9" class="node"/>
  <text x="900" y="142" text-anchor="middle" class="t">Audio</text>
  <text x="900" y="162" text-anchor="middle" class="s">speaker, mic,</text>
  <text x="900" y="178" text-anchor="middle" class="s">quote capture</text>

  <text x="480" y="228" text-anchor="middle" class="s">Phases 3 and 5 need your design input most.</text>
</svg>
