<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="System architecture: the AURA-1 device syncs through a phone hotspot and Cloudflare Access into the Raspberry Pi">
  <defs>
    <style>
      .h { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #C5BCAB; letter-spacing: 3px; }
      .t { font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #DBD5CA; }
      .s { font: 12px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #9A9385; }
      .k { font: 12px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #DBD5CA; }
      .l { font: 11px ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; fill: #C5BCAB; }
      .box { fill: #1A1A1A; stroke: #C5BCAB; stroke-width: 1.2; }
      .inner { fill: #161616; stroke: #6E6A62; stroke-width: 1; }
      .line { stroke: #C5BCAB; stroke-width: 1.2; fill: none; }
    </style>
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#1F1F1F"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C5BCAB"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#121212"/>
  <rect width="960" height="390" fill="url(#dither)"/>

  <text x="20" y="34" class="h">SYSTEM</text>

  <!-- Device -->
  <rect x="20" y="100" width="160" height="120" class="box"/>
  <text x="100" y="134" text-anchor="middle" class="t">AURA-1</text>
  <text x="100" y="158" text-anchor="middle" class="s">ESP32-S3, e-ink</text>
  <text x="100" y="178" text-anchor="middle" class="s">sessions on SD</text>
  <text x="100" y="198" text-anchor="middle" class="s">works offline</text>

  <!-- Hotspot -->
  <rect x="230" y="120" width="140" height="80" class="box"/>
  <text x="300" y="153" text-anchor="middle" class="t">Phone hotspot</text>
  <text x="300" y="176" text-anchor="middle" class="s">2.4 GHz Wi-Fi</text>

  <!-- Browser -->
  <rect x="230" y="245" width="140" height="70" class="box"/>
  <text x="300" y="275" text-anchor="middle" class="t">Browser</text>
  <text x="300" y="296" text-anchor="middle" class="s">dashboard</text>

  <!-- Cloudflare -->
  <rect x="450" y="70" width="180" height="260" class="box"/>
  <text x="540" y="98" text-anchor="middle" class="t">Cloudflare</text>
  <text x="540" y="118" text-anchor="middle" class="s">Access</text>
  <rect x="465" y="135" width="150" height="70" class="inner"/>
  <text x="540" y="163" text-anchor="middle" class="k">/api/v1/sync</text>
  <text x="540" y="183" text-anchor="middle" class="s">device token only</text>
  <rect x="465" y="225" width="150" height="70" class="inner"/>
  <text x="540" y="253" text-anchor="middle" class="k">every other path</text>
  <text x="540" y="273" text-anchor="middle" class="s">your login (SSO)</text>

  <!-- Raspberry Pi -->
  <rect x="700" y="50" width="240" height="300" class="box"/>
  <text x="820" y="78" text-anchor="middle" class="t">Raspberry Pi</text>
  <text x="820" y="98" text-anchor="middle" class="s">Docker compose</text>
  <rect x="720" y="115" width="200" height="55" class="inner"/>
  <text x="820" y="139" text-anchor="middle" class="k">cloudflared</text>
  <text x="820" y="158" text-anchor="middle" class="s">outbound tunnel</text>
  <rect x="720" y="195" width="200" height="60" class="inner"/>
  <text x="820" y="220" text-anchor="middle" class="k">api (Fastify)</text>
  <text x="820" y="240" text-anchor="middle" class="s">sync, sessions, page</text>
  <rect x="720" y="280" width="200" height="55" class="inner"/>
  <text x="820" y="304" text-anchor="middle" class="k">Postgres</text>
  <text x="820" y="322" text-anchor="middle" class="s">localhost only</text>

  <!-- Arrows -->
  <line x1="180" y1="160" x2="228" y2="160" class="line" marker-end="url(#arrow)"/>
  <text x="204" y="150" text-anchor="middle" class="l">Wi-Fi</text>

  <line x1="370" y1="168" x2="463" y2="168" class="line" marker-end="url(#arrow)"/>
  <text x="417" y="146" text-anchor="middle" class="l">HTTPS</text>
  <text x="417" y="159" text-anchor="middle" class="l">+ token</text>

  <line x1="370" y1="262" x2="463" y2="262" class="line" marker-end="url(#arrow)"/>
  <text x="417" y="240" text-anchor="middle" class="l">HTTPS</text>
  <text x="417" y="253" text-anchor="middle" class="l">+ login</text>

  <line x1="630" y1="142" x2="718" y2="142" class="line" marker-end="url(#arrow)"/>
  <text x="674" y="132" text-anchor="middle" class="l">tunnel</text>

  <line x1="820" y1="170" x2="820" y2="193" class="line" marker-end="url(#arrow)"/>
  <line x1="820" y1="255" x2="820" y2="278" class="line" marker-end="url(#arrow)"/>

  <text x="480" y="376" text-anchor="middle" class="s">No ports are open on the Pi. Everything enters through Cloudflare Access.</text>
</svg>
